<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandcode Workspace — API keys</title>
<link rel="stylesheet" href="./fonts.css?v=4">
<link rel="stylesheet" href="./tokens.css?v=4">
<link rel="stylesheet" href="./workspace.css?v=4">
<link rel="stylesheet" href="./buttons.css?v=4"><link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="description" content="Sandcode Workspace API keys — create, copy, regenerate, and revoke (mock demo).">
<meta property="og:title" content="Sandcode Workspace — API keys">
<meta property="og:description" content="Sandcode Workspace API keys — create, copy, regenerate, and revoke (mock demo).">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary"></head>
<body>
<script>try{var t=localStorage.getItem('sandcode-theme');if(t)document.body.dataset.theme=t}catch(e){}</script>
<div id="app">
  <aside id="side"></aside>
  <div id="side-scrim" hidden></div>
  <div class="main">
    <header id="topbar"></header>
    <div class="ws-page"><div class="ws-inner">
      <h1>API keys</h1>
      <p class="ws-sub">Keys inherit workspace quotas · mock data, values are fake.</p>
      <div class="ws-card">
        <table class="utable" id="keys-table"><thead><tr><th>Name</th><th>Key</th><th>Last used</th><th></th></tr></thead>
        <tbody>
          <tr><td>CI runner</td><td class="mono">sk-sand-••••ab12</td><td>2h ago</td>
            <td class="num"><button class="wbtn ghost" data-copy="sk-sand-mock-ab12-key" type="button">Copy</button>
            <button class="wbtn ghost" data-regen type="button">Regenerate</button>
            <button class="wbtn danger" data-revoke type="button">Revoke</button></td></tr>
          <tr><td>Laptop</td><td class="mono">sk-sand-••••9f04</td><td>Yesterday</td>
            <td class="num"><button class="wbtn ghost" data-copy="sk-sand-mock-9f04-key" type="button">Copy</button>
            <button class="wbtn ghost" data-regen type="button">Regenerate</button>
            <button class="wbtn danger" data-revoke type="button">Revoke</button></td></tr>
        </tbody></table>
        <div class="btnrow"><button class="wbtn" id="key-create" type="button">Create key</button></div>
      </div>
    </div></div>
  </div>
</div>
<div id="toast" hidden></div>
<script src="./chrome.js?v=4"></script>
<script src="./i18n.js?v=4"></script>
<script src="./common.js?v=4"></script>
<script src="./workspace-pages.js?v=4"></script>
</body></html>
