<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sandcode Workspace — Settings</title>
<link rel="stylesheet" href="./fonts.css">
<link rel="stylesheet" href="./tokens.css?v=3">
<link rel="stylesheet" href="./workspace.css?v=3">
<link rel="stylesheet" href="./buttons.css"><link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="description" content="Sandcode Workspace settings — profile, session sharing, and danger zone (mock demo).">
<meta property="og:title" content="Sandcode Workspace — Settings">
<meta property="og:description" content="Sandcode Workspace settings — profile, session sharing, and danger zone (mock demo).">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary"></head>
<body>
<script>try{var t=localStorage.getItem('sandcode-theme');if(t)document.body.dataset.theme=t}catch(e){}</script>
<div id="app">
  <aside id="side"></aside>
  <div id="side-scrim" hidden></div>
  <div class="main">
    <header id="topbar"></header>
    <div class="ws-page"><div class="ws-inner">
      <h1>Settings</h1>
      <p class="ws-sub">Workspace preferences · mock data, nothing is stored.</p>
      <div class="ws-card" style="margin-bottom:14px"><h3>General</h3>
        <label class="wlabel" for="ws-name">Workspace name</label>
        <input class="winput" id="ws-name" value="acme" maxlength="32">
        <label class="wlabel" for="ws-region">Region</label>
        <select class="wselect" id="ws-region"><option>US (default)</option><option>EU</option><option>Singapore</option></select>
        <div class="btnrow"><button class="wbtn" id="ws-save" type="button">Save changes</button></div></div>
      <div class="ws-card" style="margin-bottom:14px"><h3>Session sharing</h3>
        <label class="radio-card"><input type="radio" name="share" checked data-toast="Sharing: manual"><span><b>Manual</b><small>Share only when /share is used. Default.</small></span></label>
        <label class="radio-card"><input type="radio" name="share" data-toast="Sharing: auto"><span><b>Auto</b><small>Every new session is shared automatically.</small></span></label>
        <label class="radio-card"><input type="radio" name="share" data-toast="Sharing: disabled"><span><b>Disabled</b><small>/share stops working workspace-wide.</small></span></label></div>
      <div class="ws-card"><h3>Danger zone</h3><p>Leaving removes your access to shared credits and sessions.</p>
        <div class="btnrow"><button class="wbtn danger" id="ws-leave" type="button">Leave workspace</button></div></div>
    </div></div>
  </div>
</div>
<div id="toast" hidden></div>
<script src="./chrome.js"></script>
<script src="./i18n.js"></script>
<script src="./common.js"></script>
<script src="./workspace-pages.js?v=3"></script>
</body></html>
